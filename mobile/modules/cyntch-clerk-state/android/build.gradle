plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.cyntch.clerkstate'
version = '1.0.0'

android {
  namespace 'com.cyntch.clerkstate'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
}

dependencies {
  // Match @clerk/expo-native-components 0.4.3. Review together on upgrades.
  implementation('com.clerk:clerk-android-api:1.3.0') {
    version { strictly '1.3.0' }
  }
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'junit:junit:4.13.2'
}

// The installed Clerk API has Kotlin 2.3 metadata; match its Expo bridge's
// compatibility setting until the app's Expo toolchain uses that compiler.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions.freeCompilerArgs.add('-Xskip-metadata-version-check')
}
