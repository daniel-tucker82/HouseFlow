import java.security.MessageDigest

// Build the published 1.3.0 UI sources with layout patches. Keep the upstream
// Kotlin compiler and dependency versions; do not replace authentication logic.
plugins {
  id 'com.android.library' version '9.2.1'
  id 'org.jetbrains.kotlin.android' version '2.4.21'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
  id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21'
}

group = 'com.clerk'
version = '1.3.0'

configurations {
  upstreamSources { canBeConsumed = false; transitive = false }
  upstreamResources { canBeConsumed = false; transitive = false }
}
// These two artifacts are inputs, not a dependency on this replacement project.
[configurations.upstreamSources, configurations.upstreamResources].each {
  it.resolutionStrategy.useGlobalDependencySubstitutionRules = false
}

def generated = layout.buildDirectory.dir('generated/upstream')
def prepareClerkUi = tasks.register('prepareClerkUi') {
  inputs.files(configurations.upstreamSources, configurations.upstreamResources)
  inputs.file('auth-scroll.before.txt')
  inputs.file('auth-scroll.after.txt')
  outputs.dir(generated)
  doLast {
    def sources = configurations.upstreamSources.singleFile
    def resources = configurations.upstreamResources.singleFile
    [
      (sources): '8dade3976b0271ba52e5918cabd0355aae0b7495d0df35ed919b83e8afcbbb3c',
      (resources): 'c82d4af7c233a0c4a58da47e0d51686c6a52f4399b7b3de449fbd0f16145818e',
    ].each { artifact, expected ->
      def actual = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
      if (actual != expected) throw new GradleException("Unexpected Clerk source/resource artifact: ${artifact.name}")
    }
    def target = generated.get().asFile
    // Sync only this task's generated directory; no working sources are removed.
    project.sync { spec ->
      spec.into(target)
      spec.from(project.zipTree(sources)) { sourceSpec ->
        sourceSpec.include('**/*.kt')
        sourceSpec.into('kotlin')
      }
      spec.from(project.zipTree(resources)) { resourceSpec ->
        resourceSpec.include('res/**', 'AndroidManifest.xml', 'proguard.txt')
      }
    }
    def scaffold = new File(target, 'kotlin/com/clerk/ui/core/scaffold/ClerkThemedAuthScaffold.kt')
    def original = scaffold.getText('UTF-8').replace('\r\n', '\n')
    def before = file('auth-scroll.before.txt').getText('UTF-8').replace('\r\n', '\n').trim()
    def after = file('auth-scroll.after.txt').getText('UTF-8').replace('\r\n', '\n').trim()
    if (original.count(before) != 1) throw new GradleException('Clerk auth scaffold changed; review the scroll patch.')
    def patched = original.replace(before, after).replace(
      'import androidx.compose.foundation.BorderStroke',
      'import androidx.compose.foundation.rememberScrollState\n' +
      'import androidx.compose.foundation.verticalScroll\n' +
      'import androidx.compose.foundation.layout.consumeWindowInsets\n' +
      'import androidx.compose.foundation.layout.imePadding\n' +
      'import androidx.compose.foundation.layout.wrapContentWidth\n' +
      'import androidx.compose.foundation.layout.widthIn\n' +
      'import androidx.compose.foundation.BorderStroke')
    scaffold.setText(patched, 'UTF-8')
    // The fixed development footer already reserves bottom space. Consume it
    // so the inner form's IME padding uses the larger inset, not their sum.
    // Otherwise the phone's landscape scroll viewport can collapse to zero.
    def footer = new File(target, 'kotlin/com/clerk/ui/core/footer/DevelopmentModeWarning.kt')
    def footerSource = footer.getText('UTF-8').replace('\r\n', '\n')
    def footerPadding = 'Modifier.padding(bottom = metrics.height)'
    def footerImport = 'import androidx.compose.foundation.layout.BoxScope\n'
    if (footerSource.count(footerPadding) != 1 || footerSource.count(footerImport) != 1) {
      throw new GradleException('Clerk development footer changed; review keyboard inset consumption.')
    }
    footer.setText(footerSource.replace(footerPadding,
      'Modifier.padding(bottom = metrics.height).consumeWindowInsets(PaddingValues(bottom = metrics.height))')
      .replace(footerImport, footerImport +
        'import androidx.compose.foundation.layout.PaddingValues\n' +
        'import androidx.compose.foundation.layout.consumeWindowInsets\n'), 'UTF-8')
    // The upstream header pads only the status bar. A side navigation bar in
    // landscape can then cover Close/Back (observed on the API 24 emulator).
    def topBar = new File(target, 'kotlin/com/clerk/ui/core/appbar/ClerkTopAppbar.kt')
    def topBarSource = topBar.getText('UTF-8').replace('\r\n', '\n')
    def topBarInsets = '.windowInsetsPadding(WindowInsets.statusBars)'
    def insetsImport = 'import androidx.compose.foundation.layout.WindowInsets\n'
    def topBarPadding = '.padding(vertical = dp8)'
    def topBarColor = 'val resolvedBackgroundColor = backgroundColor ?: ClerkMaterialTheme.colors.muted'
    if (topBarSource.count(topBarInsets) != 1 || topBarSource.count(insetsImport) != 1 ||
        topBarSource.count(topBarPadding) != 1 || topBarSource.count(topBarColor) != 1) {
      throw new GradleException('Clerk top bar changed; review safe-area patch.')
    }
    // A landscape IME plus enlarged text can leave less space than the complete
    // outlined field (including its floating label). Remove only the header's
    // decorative vertical padding while typing; keep its 48dp controls and all
    // safe-area insets. The normal header spacing returns with keyboard dismissal.
    topBar.setText(topBarSource.replace(topBarInsets,
      '.windowInsetsPadding(WindowInsets.safeDrawing.only(WindowInsetsSides.Horizontal + WindowInsetsSides.Top))')
      .replace(topBarPadding, '.padding(vertical = if (compactKeyboardHeader) 0.dp else dp8)')
      .replace(topBarColor, topBarColor + '\n' +
        '    val compactKeyboardHeader =\n' +
        '      WindowInsets.ime.getBottom(LocalDensity.current) > 0 &&\n' +
        '        LocalConfiguration.current.orientation == Configuration.ORIENTATION_LANDSCAPE')
      .replace(insetsImport, insetsImport +
        'import android.content.res.Configuration\n' +
        'import androidx.compose.foundation.layout.WindowInsetsSides\n' +
        'import androidx.compose.foundation.layout.ime\n' +
        'import androidx.compose.foundation.layout.only\n' +
        'import androidx.compose.foundation.layout.safeDrawing\n' +
        'import androidx.compose.ui.platform.LocalConfiguration\n' +
        'import androidx.compose.ui.platform.LocalDensity\n' +
        'import androidx.compose.ui.unit.dp\n'), 'UTF-8')
    // Fixed button heights clip scaled text plus the upstream content padding.
    // Preserve the minimum target, allowing the measured content to grow.
    [
      ['social/ClerkSocialButton.kt', '.height(dp48)', '.heightIn(min = dp48)', 2],
      ['standard/ClerkButton.kt', 'Modifier.height(tokens.height)', 'Modifier.heightIn(min = tokens.height)', 1],
    ].each { patch ->
      def button = new File(target, "kotlin/com/clerk/ui/core/button/${patch[0]}")
      def buttonSource = button.getText('UTF-8').replace('\r\n', '\n')
      def heightImport = 'import androidx.compose.foundation.layout.height\n'
      if (buttonSource.count(patch[1]) != patch[3] || buttonSource.count(heightImport) != 1) {
        throw new GradleException("Clerk button changed; review text sizing patch: ${patch[0]}")
      }
      button.setText(buttonSource.replace(patch[1], patch[2]).replace(
        heightImport, 'import androidx.compose.foundation.layout.heightIn\n'), 'UTF-8')
    }
    logger.lifecycle('[Cyntch] Applied pinned Clerk 1.3.0 auth scrolling, content width, safe-area and button text sizing patches')
  }
}

android {
  namespace 'com.clerk.ui'
  compileSdk 36
  defaultConfig {
    minSdk 24
    // AGP 9 rejects Provider values in this API. prepareClerkUi remains an
    // explicit preBuild dependency; resolving this path performs no file IO.
    consumerProguardFiles generated.get().file('proguard.txt').asFile
  }
  buildFeatures { compose = true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  sourceSets {
    main {
      java.srcDir generated.get().dir('kotlin').asFile
      res.srcDir generated.get().dir('res').asFile
      manifest.srcFile generated.get().file('AndroidManifest.xml').asFile
      assets.srcDir 'assets'
    }
  }
}
kotlin { jvmToolchain(17) }
tasks.named('preBuild').configure { dependsOn prepareClerkUi }

dependencies {
  upstreamSources 'com.clerk:clerk-android-ui:1.3.0:sources@jar'
  upstreamResources 'com.clerk:clerk-android-ui:1.3.0@aar'

  // These mirror the published 1.3.0 POM and source/ui/build.gradle.kts.
  api 'com.clerk:clerk-android-api:1.3.0'
  api 'com.clerk:clerk-android-telemetry:1.1.2'
  implementation platform('androidx.compose:compose-bom:2026.06.01')
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.appcompat:appcompat:1.8.0'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'org.jetbrains.compose.material:material-icons-core:1.7.3'
  implementation 'androidx.compose.runtime:runtime'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:2.10.0'
  implementation 'androidx.navigation3:navigation3-runtime:1.1.7'
  implementation 'androidx.navigation3:navigation3-ui:1.1.7'
  implementation 'androidx.compose.ui:ui'
  implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
  implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
  implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.41'
  implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.5.2'
  implementation 'androidx.compose.material3:material3:1.4.0'
  implementation 'com.materialkolor:material-kolor:4.1.1'
  compileOnly 'androidx.compose.ui:ui-tooling-preview-android:1.12.1'
}
