appId: com.cyntch.app
name: Native sign-in opens the household and preserves the session
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- setOrientation: ${PORTRAIT_ORIENTATION}
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 60000
- scrollUntilVisible:
    element: "Sign in or create an account"
    direction: DOWN
    visibilityPercentage: 100
# A newly rotated simulator can expose the welcome button before its touch
# surface has settled. Retain its actual geometry before the single opening tap.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: native-sign-in-ready
- tapOn:
    text: "Sign in or create an account"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "clerk.auth.start.identifier"
    timeout: 60000
- tapOn:
    id: "clerk.auth.start.identifier"
- inputText: ${TEST_EMAIL}
# Verify the actual field value before submitting. Acknowledging inputText alone
# cannot prove that the keyboard delivered the reserved fixture's full address.
- assertVisible:
    id: "clerk.auth.start.identifier"
    text: ${TEST_EMAIL_PATTERN}
- takeScreenshot: native-sign-in-identifier
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# On iOS the identified Continue button is usable with the keyboard shown.
# The generic dismiss command can tap the neighboring Google sign-in button.
- scrollUntilVisible:
    element:
      id: "clerk.auth.start.continue"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "clerk.auth.start.continue"
- extendedWaitUntil:
    visible: "Use another method"
    timeout: 60000
# Preserve the provider's initial challenge as well as its alternative methods.
# A failed email choice must not be misdiagnosed from the final screen alone.
- takeScreenshot: native-sign-in-challenge
- tapOn: "Use another method"
- takeScreenshot: native-sign-in-methods
- tapOn: ".*Email.*code.*"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 60000
- tapOn:
    id: "clerk.auth.signIn.code"
    optional: true
# Clerk's reserved development test address uses this code without email.
- inputText: "424242"
- runFlow:
    when:
      true: ${DEFER_TERMS === 'true'}
    commands:
      - extendedWaitUntil:
          visible: "Before sharing with your household"
          timeout: 60000
      - scrollUntilVisible:
          element: "Continue without creating content"
          direction: DOWN
          centerElement: true
      - tapOn: "Continue without creating content"
- runFlow: verify-household.yaml
- takeScreenshot: authenticated-board-portrait
# Focused journeys use real sign-in, then verify their own rotation/restarts.
# Full device checks retain every session/chooser capture.
- runFlow:
    when:
      true: ${VERIFY_SESSION_JOURNEY !== 'false'}
    commands:
      - tapOn: "^Choose household: Cyntch emulator family$"
      - assertVisible:
          text: "^Cyntch emulator family$"
          selected: true
      - takeScreenshot: authenticated-household-chooser
      - tapOn: "^Choose household: Cyntch emulator family$"
      - setOrientation: ${LANDSCAPE_ORIENTATION}
      - runFlow: verify-household.yaml
      - takeScreenshot: authenticated-board-landscape
      - setOrientation: ${PORTRAIT_ORIENTATION}
      - stopApp
      - launchApp
      - runFlow: verify-household.yaml
      - assertNotVisible: "Sign in or create an account"
      - takeScreenshot: authenticated-board-after-restart
- stopApp
