appId: com.cyntch.app
---
# The collapsed header must identify the active household without opening a menu.
- extendedWaitUntil:
    visible: "^Choose household: Cyntch emulator family$"
    timeout: 60000
- scrollUntilVisible:
    element: "^Pack school bag for tomorrow.*"
    direction: DOWN
    timeout: 20000
- assertVisible: "^Pack school bag for tomorrow.*"
