appId: com.cyntch.app
---
- scrollUntilVisible:
    element: "Their name"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "Their name"
- inputText: "Native member check"
- runFlow:
    file: dismiss-field-keyboard.yaml
    env:
      FIELD_LABEL_PATTERN: "^Their name$"
- scrollUntilVisible:
    element: "^Add member$"
    direction: DOWN
    centerElement: true
- tapOn: "^Add member$"
- scrollUntilVisible:
    element: "Rename Native member check"
    direction: UP
    centerElement: true
    timeout: 60000
