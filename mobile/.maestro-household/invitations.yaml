appId: com.cyntch.app
name: Invitation limits, copy, persistence and revocation
---
# A resume code must identify the invitation saved by an inspected failed run.
# The default journey creates its own link; creation is never retried in a flow.
- launchApp
- setOrientation: ${PORTRAIT_ORIENTATION}
- tapOn: "(?i)^Household(,.*)?$"
- evalScript: ${output.inviteCode = (typeof RESUME_INVITE_CODE === 'string' && RESUME_INVITE_CODE) || ''}
- runFlow:
    when:
      true: ${output.inviteCode.length === 0}
    file: invitation-create.yaml
- assertTrue: ${output.inviteCode.length === 12 && /^[a-f0-9]+$/.test(output.inviteCode)}
- scrollUntilVisible:
    element: "${'Invitation code: ' + output.inviteCode}"
    direction: DOWN
    centerElement: true
- assertVisible: "3 uses.*|0 of 3 uses.*"
- takeScreenshot: invitation-created-portrait
- scrollUntilVisible:
    element: ${'Copy invitation ' + output.inviteCode}
    direction: DOWN
    centerElement: true
- tapOn: ${'Copy invitation ' + output.inviteCode}
- scrollUntilVisible:
    element: "Invitation link copied."
    direction: UP
    centerElement: true
- setOrientation: ${LANDSCAPE_ORIENTATION}
- scrollUntilVisible:
    element: "${'Invitation code: ' + output.inviteCode}"
    direction: DOWN
    centerElement: true
- takeScreenshot: invitation-created-landscape
- setOrientation: ${PORTRAIT_ORIENTATION}
- stopApp
- launchApp
- tapOn: "(?i)^Household(,.*)?$"
- scrollUntilVisible:
    element: "${'Invitation code: ' + output.inviteCode}"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "0 of 3 uses.*"
- takeScreenshot: invitation-after-restart
- scrollUntilVisible:
    element: ${'Revoke invitation ' + output.inviteCode}
    direction: DOWN
    centerElement: true
- tapOn: ${'Revoke invitation ' + output.inviteCode}
- assertVisible: "Revoke this invitation[?]"
- tapOn: "^Cancel$"
- assertVisible: ${'Revoke invitation ' + output.inviteCode}
- tapOn: ${'Revoke invitation ' + output.inviteCode}
- tapOn: "^Revoke invitation$"
- extendedWaitUntil:
    notVisible: ${'Revoke invitation ' + output.inviteCode}
    timeout: 60000
- scrollUntilVisible:
    element: "Invitation revoked. Existing members still belong to your household."
    direction: UP
    centerElement: true
- takeScreenshot: invitation-revoked
- stopApp
