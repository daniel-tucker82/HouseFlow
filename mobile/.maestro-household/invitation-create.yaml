appId: com.cyntch.app
---
- scrollUntilVisible:
    element: "Maximum uses"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: "Maximum uses"
- eraseText
- inputText: "3"
- runFlow:
    file: dismiss-field-keyboard.yaml
    env:
      FIELD_LABEL_PATTERN: "^Maximum uses$"
- tapOn:
    id: '^Expires after \(days\)$'
- eraseText
- inputText: "7"
- runFlow:
    file: dismiss-field-keyboard.yaml
    env:
      FIELD_LABEL_PATTERN: '^Expires after \(days\)$'
- scrollUntilVisible:
    element: "^Create invitation$"
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      text: "^Create invitation$"
      enabled: true
    timeout: 60000
- tapOn: "^Create invitation$"
- extendedWaitUntil:
    visible: "Invitation created."
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "^Invitation code: .*"
      index: 0
    direction: DOWN
    centerElement: true
- copyTextFrom:
    text: "^Invitation code: .*"
    index: 0
- evalScript: ${output.inviteCode = maestro.copiedText.trim().split(' ').pop()}
