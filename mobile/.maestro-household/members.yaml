appId: com.cyntch.app
name: A parent can rename a no-email member and choose a persistent colour
---
# Explicit isolated-fixture check. Create a dedicated local member, then remove
# that membership; never rename the original parent or child used by other tests.
- launchApp
- setOrientation: ${PORTRAIT_ORIENTATION}
- tapOn: "(?i)^Household(,.*)?$"
- extendedWaitUntil:
    visible: "Everyone at home"
    timeout: 60000
- assertNotVisible: "Rename Taylor Test"
- runFlow:
    when:
      true: ${RESUME_MEMBER_CHECK !== 'true'}
    file: member-create.yaml
- runFlow:
    when:
      true: ${RESUME_MEMBER_CHECK === 'true'}
    commands:
      - scrollUntilVisible:
          element: "Rename Native member check"
          direction: DOWN
          centerElement: true
          timeout: 60000
- tapOn: "Rename Native member check"
- runFlow: clear-member-name.yaml
- inputText: "Cancelled name"
- copyTextFrom:
    id: "Name for Native member check"
- assertTrue: ${maestro.copiedText === 'Cancelled name'}
- runFlow:
    file: dismiss-field-keyboard.yaml
    env:
      FIELD_LABEL_PATTERN: "^Name for Native member check$"
- scrollUntilVisible:
    element: "Cancel name change"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: member-cancel-name-ready
- tapOn: "Cancel name change"
- assertVisible: "Rename Native member check"
- assertNotVisible: "Rename Cancelled name"
# Cancelling collapses the input and moves Rename above the current scroll
# position on iPhone. Re-centre the actual control before trying to reopen it.
- scrollUntilVisible:
    element: "Rename Native member check"
    direction: UP
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: member-rename-after-cancel-ready
- tapOn: "Rename Native member check"
- runFlow: clear-member-name.yaml
- inputText: "Native member renamed"
- copyTextFrom:
    id: "Name for Native member check"
- assertTrue: ${maestro.copiedText === 'Native member renamed'}
- runFlow:
    file: dismiss-field-keyboard.yaml
    env:
      FIELD_LABEL_PATTERN: "^Name for Native member check$"
- scrollUntilVisible:
    element: "Save name"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: member-save-name-ready
- tapOn: "Save name"
- extendedWaitUntil:
    visible: "Rename Native member renamed"
    timeout: 60000
- scrollUntilVisible:
    element: "Change colour for Native member renamed"
    direction: DOWN
    centerElement: true
- tapOn: "Change colour for Native member renamed"
- scrollUntilVisible:
    element: "Native member renamed: Violet colour"
    direction: DOWN
    centerElement: true
- tapOn: "Native member renamed: Violet colour"
- extendedWaitUntil:
    visible: "Change colour for Native member renamed"
    timeout: 60000
- tapOn: "Change colour for Native member renamed"
- scrollUntilVisible:
    element: "Native member renamed: Violet colour"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "Native member renamed: Violet colour"
    selected: true
- takeScreenshot: member-colour-portrait
- setOrientation: ${LANDSCAPE_ORIENTATION}
- scrollUntilVisible:
    element: "Native member renamed: Violet colour"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "Native member renamed: Violet colour"
    selected: true
- takeScreenshot: member-colour-landscape
- setOrientation: ${PORTRAIT_ORIENTATION}
- stopApp
- launchApp
- tapOn: "(?i)^Household(,.*)?$"
- scrollUntilVisible:
    element: "Rename Native member renamed"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "Rename Native member check"
- tapOn: "Change colour for Native member renamed"
- scrollUntilVisible:
    element: "Native member renamed: Violet colour"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "Native member renamed: Violet colour"
    selected: true
- takeScreenshot: member-colour-after-restart
- tapOn: "(?i)^Today(,.*)?$"
# A screen-wide horizontal scroll can hit the task search field. Start inside
# the member strip, then verify the actual member selection before capturing it.
- swipe:
    from:
      text: "^Alex$"
    direction: LEFT
- tapOn: "^Native member renamed$"
- assertVisible:
    text: "^Native member renamed$"
    selected: true
- assertVisible: "(?i)^Household(,.*)?$"
- takeScreenshot: member-colour-on-board
- tapOn: "(?i)^Household(,.*)?$"
- scrollUntilVisible:
    element: "Remove Native member renamed"
    direction: DOWN
    centerElement: true
- tapOn: "Remove Native member renamed"
- assertVisible: "Remove Native member renamed[?]"
- tapOn: "^Remove$"
- extendedWaitUntil:
    notVisible: "Remove Native member renamed"
    timeout: 60000
- stopApp
- launchApp
- tapOn: "(?i)^Household(,.*)?$"
- assertVisible: "Everyone at home"
- assertNotVisible: ".*Native member renamed.*"
- takeScreenshot: member-removed-after-restart
- stopApp
- runFlow: invitations.yaml
- runFlow: deletion-review.yaml
