appId: com.cyntch.app
name: Disposable account deletion preserves its receipt and completes device cleanup
---
# Explicitly gated by native-account-deletion-smoke.cjs. The development backend
# must isolate this marked identity, its disposable household and provider erasure.
- launchApp
- setOrientation: ${PORTRAIT_ORIENTATION}
- runFlow: ../.maestro-auth/verify-household.yaml
- tapOn: "(?i)^Settings(,.*)?$"
- scrollUntilVisible:
    centerElement: true
    element: "Review account deletion"
    direction: DOWN
- tapOn: "Review account deletion"
- extendedWaitUntil:
    visible: "Your account and content"
    timeout: 60000
- scrollUntilVisible:
    # Visibility must be inside the content area, above the bottom tabs. The
    # final button cannot reach Maestro's centring threshold at the page end.
    element:
      text: "^Delete my account$"
      above: "(?i)^Today(,.*)?$"
    direction: DOWN
- assertVisible:
    text: "Delete my account"
    enabled: false
- scrollUntilVisible:
    centerElement: true
    element: ".*Delete this household for everyone"
    direction: UP
- tapOn: ".*Delete this household for everyone"
- assertVisible: "● Delete this household for everyone"
- takeScreenshot: deletion-review-portrait
- setOrientation: ${LANDSCAPE_ORIENTATION}
- scrollUntilVisible:
    centerElement: true
    element: "● Delete this household for everyone"
    direction: DOWN
- takeScreenshot: deletion-review-landscape
- setOrientation: ${PORTRAIT_ORIENTATION}
- scrollUntilVisible:
    centerElement: true
    element: "I understand the account and household deletion consequences"
    direction: DOWN
- tapOn: "I understand the account and household deletion consequences"
- assertVisible:
    text: "I understand the account and household deletion consequences"
    checked: true
- scrollUntilVisible:
    element:
      text: "^Delete my account$"
      above: "(?i)^Today(,.*)?$"
    direction: DOWN
- assertVisible:
    text: "Delete my account"
    enabled: false
- scrollUntilVisible:
    centerElement: true
    element: "I understand the subscription consequences"
    direction: UP
- tapOn: "I understand the subscription consequences"
- assertVisible:
    text: "I understand the subscription consequences"
    checked: true
# Accessibility can report a button above a tab's label while its tap centre
# still overlaps the tab icon. Finish scrolling the final card before tapping.
- scroll
- scrollUntilVisible:
    element:
      text: "^Delete my account$"
      above: "(?i)^Today(,.*)?$"
    direction: DOWN
- assertVisible:
    text: "Delete my account"
    enabled: true
- takeScreenshot: deletion-submit-ready
- tapOn:
    text: "^Delete my account$"
    above: "(?i)^Today(,.*)?$"
    enabled: true
- assertVisible: "^Delete your Cyntch account[?]$"
- tapOn: "^Keep account$"
- assertNotVisible: "^Delete your Cyntch account[?]$"
- assertVisible:
    text: "Delete my account"
    enabled: true
- takeScreenshot: deletion-cancelled-confirmation
- tapOn:
    text: "^Delete my account$"
    above: "(?i)^Today(,.*)?$"
    enabled: true
- tapOn:
    text: "^Delete account$"
    retryTapIfNoChange: false
- runFlow: open-status.yaml
- takeScreenshot: deletion-accepted
- stopApp
- launchApp
- runFlow: open-status.yaml
- takeScreenshot: deletion-receipt-after-restart
# Only status reads repeat. The destructive submission above executes once.
- repeat:
    times: 12
    while:
      notVisible: "^Account deleted$"
    commands:
      - scrollUntilVisible:
          element:
            text: "^Check status$"
            enabled: true
          direction: UP
          timeout: 30000
      - tapOn: "^Check status$"
      - extendedWaitUntil:
          visible:
            text: "^Check status$"
            enabled: true
          timeout: 30000
- assertVisible: "^Account deleted$"
- takeScreenshot: deletion-completed
- stopApp
- launchApp
- runFlow: open-status.yaml
- assertVisible: "^Account deleted$"
- runFlow:
    when:
      visible: "Retry device cleanup"
    commands:
      - tapOn: "Retry device cleanup"
- scrollUntilVisible:
    element: "Remove saved receipt"
    direction: DOWN
    timeout: 60000
- takeScreenshot: deletion-cleanup-after-restart
- tapOn: "Remove saved receipt"
- assertVisible: "^Remove this receipt[?]$"
- tapOn: "^Remove receipt$"
- runFlow:
    when:
      visible: "^Close$"
    commands:
      - tapOn: "^Close$"
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 60000
- stopApp
- launchApp
- assertVisible: "Sign in or create an account"
- assertNotVisible: "Check saved account deletion"
- assertNotVisible: "^Choose household: Cyntch emulator family$"
- takeScreenshot: deletion-signed-out-after-restart
- stopApp
