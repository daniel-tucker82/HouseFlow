appId: com.cyntch.app
name: Explicit terms and a private concern survive rotation and draft restart
---
- launchApp
- setOrientation: ${PORTRAIT_ORIENTATION}
- runFlow:
    when:
      true: ${RESUME_TERMS != "true"}
    file: terms.yaml
- assertNotVisible: "Before sharing with your household"
- tapOn: "(?i)^Settings(,.*)?$"
- scrollUntilVisible:
    element: "Report content or a member"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Report content or a member"
    enabled: true
- tapOn: "A household member"
- scrollUntilVisible:
    element:
      id: "safety-report-subject"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "safety-report-subject"
- inputText: "Disposable verification member"
- scrollUntilVisible:
    element:
      id: "safety-report-message"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "safety-report-message"
- inputText: "Disposable UI verification only. No real concern or person."
# Dismiss the keyboard before scrolling beyond the multiline input.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Describe your concern"
- scrollUntilVisible:
    element: "Draft saved on this device. It has not been sent."
    direction: DOWN
    centerElement: true
- assertVisible: "Draft saved on this device. It has not been sent."
- scrollUntilVisible:
    element: "Close report"
    direction: DOWN
    centerElement: true
- tapOn: "Close report"
- stopApp
- launchApp
- assertNotVisible: "Before sharing with your household"
- tapOn: "(?i)^Settings(,.*)?$"
- runFlow: open-saved.yaml
- assertVisible: "Disposable verification member"
- scrollUntilVisible:
    element: "Disposable UI verification only. No real concern or person."
    direction: DOWN
    centerElement: true
- takeScreenshot: report-draft-after-restart
- setOrientation: ${LANDSCAPE_ORIENTATION}
- scrollUntilVisible:
    element: "Disposable UI verification only. No real concern or person."
    direction: DOWN
    centerElement: true
- takeScreenshot: report-draft-landscape
- setOrientation: ${PORTRAIT_ORIENTATION}
- scrollUntilVisible:
    element: "Close report"
    direction: DOWN
    centerElement: true
- tapOn: "Close report"
