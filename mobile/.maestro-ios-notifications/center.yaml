appId: com.apple.springboard
name: The injected Cyntch alert appears in iOS Notification Center
---
# Do not launch Cyntch: both assertions must be in the OS, not the app inbox.
# Start just inside the top-left edge, away from the Dynamic Island. A swipe
# from y=0 at the top center was acknowledged but left SpringBoard at Home.
- swipe:
    start: "25%,1%"
    end: "25%,85%"
    duration: 500
- extendedWaitUntil:
    visible: ${ALERT_TITLE}
    timeout: 15000
- assertVisible: ${ALERT_BODY}
- takeScreenshot: ios-notification-center
