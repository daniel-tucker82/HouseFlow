appId: com.cyntch.app
---
- scrollUntilVisible:
    element: "These choices apply only to this device and this household."
    direction: UP
- scrollUntilVisible:
    element: "Tasks become startable: Taylor Test"
    direction: DOWN
    centerElement: true
- runFlow:
    file: verify-member-state.yaml
    env:
      MEMBER_LABEL: "Tasks become startable: Taylor Test"
      CHECKED: "true"
- runFlow:
    file: verify-member-state.yaml
    env:
      MEMBER_LABEL: "Tasks become startable: Alex"
      CHECKED: "false"
- scrollUntilVisible:
    element: "Tasks marked complete: Taylor Test"
    direction: DOWN
    centerElement: true
- runFlow:
    file: verify-member-state.yaml
    env:
      MEMBER_LABEL: "Tasks marked complete: Taylor Test"
      CHECKED: "false"
- runFlow:
    file: verify-member-state.yaml
    env:
      MEMBER_LABEL: "Tasks marked complete: Alex"
      CHECKED: "true"
