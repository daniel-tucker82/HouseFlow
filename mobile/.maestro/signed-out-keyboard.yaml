appId: com.cyntch.app
name: Native sign-in keyboard and rotation retain entered text
env:
  IOS_FAMILY: ${IOS_FAMILY || "iphone"}
  PORTRAIT_ORIENTATION: ${PORTRAIT_ORIENTATION || "PORTRAIT"}
  LANDSCAPE_ORIENTATION: ${LANDSCAPE_ORIENTATION || "LANDSCAPE_LEFT"}
---
- launchApp:
    # Each case starts with its own empty form; Clerk retains identifiers.
    clearState: true
    permissions:
      all: deny
- setOrientation: ${PORTRAIT_ORIENTATION}
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 60000
- scrollUntilVisible:
    element: "Sign in or create an account"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 100
- tapOn: "Sign in or create an account"
- extendedWaitUntil:
    visible:
      id: "clerk.auth.start.identifier"
    timeout: 60000
# This reserved address is only typed locally. The flow never taps Continue,
# submits authentication, creates an account or sends an email.
# A hosted iOS keyboard dropped a character during initial fixture entry. Only
# this setup may be replaced; every later rotation/retention assertion is strict.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "clerk.auth.start.identifier"
      - eraseText
      - inputText: "layout-check@example.invalid"
      - assertVisible:
          id: "clerk.auth.start.identifier"
          text: 'layout-check@example\.invalid'
      # The iPad can retain its dismissed keyboard between the two text sizes.
      # Refocus the field once, without changing its value, then require keys.
      - runFlow:
          when:
            notVisible: "^q$"
          commands:
            - tapOn:
                id: "clerk.auth.start.identifier"
      - assertVisible: "q"
      - assertVisible: "p"
# The disposable test images use English keyboards. Require actual keyboard
# keys so a hardware-keyboard-only run cannot claim software-keyboard coverage.
- assertVisible: "q"
- assertVisible: "p"
- takeScreenshot: native-keyboard-portrait
- setOrientation: ${LANDSCAPE_ORIENTATION}
- scrollUntilVisible:
    element:
      id: "clerk.auth.start.identifier"
    direction: UP
    timeout: 10000
    visibilityPercentage: 100
- assertVisible:
    id: "clerk.auth.start.identifier"
    text: 'layout-check@example\.invalid'
- assertVisible: "q"
- assertVisible: "w"
- takeScreenshot: native-keyboard-landscape
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      # Dragging the floating iPad sign-in sheet can close the entire form.
      # Its full-size system keyboard has a dedicated dismissal key instead.
      - runFlow:
          when:
            true: ${IOS_FAMILY == "ipad"}
          commands:
            - tapOn:
                text: "(?i)^(hide|dismiss) keyboard$"
                optional: true
            - runFlow:
                when:
                  visible: "^q$"
                commands:
                  # Some XCTest versions omit this key's accessibility label.
                  # This point is inside the landscape keyboard dismissal key.
                  - tapOn:
                      point: "94%,92%"
      - runFlow:
          when:
            true: ${IOS_FAMILY == "iphone"}
          commands:
            - swipe:
                start: "50%,20%"
                end: "50%,95%"
                duration: 600
      - assertNotVisible: "^q$"
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "clerk.auth.start.continue"
    enabled: true
- takeScreenshot: native-keyboard-dismissed-landscape
- setOrientation: ${PORTRAIT_ORIENTATION}
- scrollUntilVisible:
    element:
      id: "clerk.auth.start.identifier"
    direction: UP
    timeout: 10000
    visibilityPercentage: 100
- assertVisible:
    id: "clerk.auth.start.identifier"
    text: 'layout-check@example\.invalid'
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - scrollUntilVisible:
          element: "Sign in or create an account"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 100
      - assertVisible: "Sign in or create an account"
      - takeScreenshot: welcome-after-back-portrait
- stopApp
