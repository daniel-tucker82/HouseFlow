appId: com.cyntch.app
name: Signed-out startup, rotation and native authentication
env:
  PORTRAIT_ORIENTATION: ${PORTRAIT_ORIENTATION || "PORTRAIT"}
  LANDSCAPE_ORIENTATION: ${LANDSCAPE_ORIENTATION || "LANDSCAPE_LEFT"}
---
- launchApp:
    permissions:
      all: deny
- setOrientation: ${PORTRAIT_ORIENTATION}
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 60000
- assertVisible: "A little more together."
- takeScreenshot: welcome-portrait
- setOrientation: ${LANDSCAPE_ORIENTATION}
- assertVisible: "Sign in or create an account"
- takeScreenshot: welcome-landscape
- setOrientation: ${PORTRAIT_ORIENTATION}
- tapOn: "Sign in or create an account"
- extendedWaitUntil:
    visible:
      id: "clerk.auth.start.identifier"
    timeout: 60000
# Verify the complete action is reachable, including when the form needs scrolling.
# Compose can expose an ID's full screen bounds even when its scroll parent clips
# the label. Scroll to the rendered text, then also require the expected action ID.
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "clerk.auth.start.continue"
- takeScreenshot: native-sign-in-portrait
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Continue with Google"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 100
          centerElement: true
      - takeScreenshot: native-social-sign-in-portrait
- setOrientation: ${LANDSCAPE_ORIENTATION}
- scrollUntilVisible:
    element:
      id: "clerk.auth.start.identifier"
    direction: UP
    timeout: 10000
    visibilityPercentage: 100
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "clerk.auth.start.continue"
- takeScreenshot: native-sign-in-landscape
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Continue with Google"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 100
          centerElement: true
      - takeScreenshot: native-social-sign-in-landscape
      # Close must remain tappable beside a landscape system navigation bar.
      - tapOn: "Close"
      - assertVisible: "Sign in or create an account"
      - takeScreenshot: welcome-after-dismiss-landscape
      - tapOn: "Sign in or create an account"
      - extendedWaitUntil:
          visible:
            id: "clerk.auth.start.identifier"
          timeout: 60000
- setOrientation: ${PORTRAIT_ORIENTATION}
- stopApp
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 60000
- assertVisible: "A little more together."
- takeScreenshot: welcome-after-restart
