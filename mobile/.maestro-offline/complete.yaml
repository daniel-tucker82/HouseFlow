appId: com.cyntch.app
---
- extendedWaitUntil:
    visible: "You’re offline. You can still complete saved tasks."
    timeout: 60000
- tapOn:
    text: "^Android offline verification,.*"
    checked: false
# Completed tasks sort after ready tasks and can move outside the viewport.
- scrollUntilVisible:
    element: "^Android offline verification,.*"
    direction: DOWN
- assertVisible:
    text: "^Android offline verification,.*"
    checked: true
- assertVisible: "1 change saved on this device. Will sync when connected."
- takeScreenshot: offline-completion-saved
