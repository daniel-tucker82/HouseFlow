appId: com.cyntch.app
---
- extendedWaitUntil:
    visible: "You’re offline. You can still complete saved tasks."
    timeout: 60000
# The offline banner changes the list viewport after prepare. Locate and centre
# the checkbox again so the tap cannot land beneath the bottom navigation.
- scrollUntilVisible:
    element: "^Android offline verification,.*"
    direction: DOWN
    centerElement: true
- assertVisible: "^Open details: Android offline verification,.*[.] Ready$"
- tapOn: "^Android offline verification,.*"
# Completed tasks sort after ready tasks and can move outside the viewport.
- scrollUntilVisible:
    element: "^Android offline verification,.*"
    direction: DOWN
    centerElement: true
# iOS exposes `value=checkbox, checked`, but Maestro 2.12.1 reports its
# `checked` attribute as false. Assert this task's explicit Completed state.
- assertVisible: "^Open details: Android offline verification,.*[.] Completed$"
- assertVisible: "1 change saved on this device. Will sync when connected."
- takeScreenshot: offline-completion-saved
