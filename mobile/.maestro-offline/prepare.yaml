appId: com.cyntch.app
---
- launchApp
- setOrientation: ${PORTRAIT_ORIENTATION}
- runFlow: ../.maestro-auth/verify-household.yaml
- tapOn: "^All$"
- scrollUntilVisible:
    element: "^Android offline verification,.*"
    direction: DOWN
    centerElement: true
# A prior interrupted run may have acknowledged completion. Reopen only this
# disposable task through the real UI; retain its server receipt history.
- runFlow:
    when:
      visible: "^Open details: Android offline verification,.*[.] Completed$"
    commands:
      - takeScreenshot: offline-existing-completion
      - tapOn:
          text: "^Android offline verification,.*"
      - scrollUntilVisible:
          element: "^Android offline verification,.*"
          direction: UP
          centerElement: true
      - extendedWaitUntil:
          notVisible: ".*change saved on this device.*"
          timeout: 60000
- assertVisible: "^Open details: Android offline verification,.*[.] Ready$"
- assertNotVisible: ".*change saved on this device.*"
- takeScreenshot: offline-before-edit
