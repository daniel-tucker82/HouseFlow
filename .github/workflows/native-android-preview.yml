name: Signed Android preview verification

on:
  push:
    branches: [codex/native-mobile-apps]
    paths:
      - .github/workflows/native-android-preview.yml
      - .github/scripts/android-preview-*.cjs
      - .github/fixtures/android-preview.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Require unchanged app source and download the exact signed preview
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = daniel-tucker82/HouseFlow
          test "$GITHUB_REF_NAME" = codex/native-mobile-apps
          source=$(jq -r .source .github/fixtures/android-preview.json)
          [[ "$source" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$source" "$GITHUB_SHA"
          git diff --quiet "$source" "$GITHUB_SHA" -- . ':!.github/' ':!mobile/README.md'
          url=$(jq -r .url .github/fixtures/android-preview.json)
          [[ "$url" =~ ^https://expo\.dev/artifacts/eas/[A-Za-z0-9_-]+\.apk$ ]]
          mkdir -p "$RUNNER_TEMP/cyntch-signed-preview"
          curl --fail --location --retry 2 "$url" -o "$RUNNER_TEMP/cyntch-signed-preview.apk"
          printf '%s  %s\n' "$(jq -r .sha256 .github/fixtures/android-preview.json)" "$RUNNER_TEMP/cyntch-signed-preview.apk" | sha256sum -c -
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
      - name: Verify signing, Firebase resources, bundled configuration and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          node .github/scripts/android-preview-artifact.cjs "$RUNNER_TEMP/cyntch-signed-preview.apk" \
            "$RUNNER_TEMP/cyntch-signed-preview" "$ANDROID_HOME/build-tools/36.0.0" readelf
      - name: Install and validate the existing signed-out journey
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7' "$RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          java -cp "$RUNNER_TEMP/maestro-cli/maestro/lib/*" .github/scripts/CheckMaestroFlows.java mobile .maestro/signed-out.yaml
      - name: Enable emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the EAS APK without rebuilding
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 18
        with:
          api-level: '36'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: cyntch-eas-preview
          disk-size: 6G
          cores: 2
          ram-size: 4096M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node .github/scripts/android-preview-smoke.cjs "$RUNNER_TEMP/cyntch-signed-preview.apk" "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro" "$RUNNER_TEMP/cyntch-signed-preview"
      - name: Retain signed preview evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-android-preview-evidence
          path: ${{ runner.temp }}/cyntch-signed-preview/
          if-no-files-found: warn
          retention-days: 7
