name: Native iOS verification

on:
  push:
    branches: [codex/native-mobile-apps]
    paths:
      - mobile/**
      - '!mobile/**/*.md'
      - shared/**
      - lib/recurrence.ts
      - lib/time-rules.ts
      - lib/types.ts
      - .github/workflows/native-ios.yml
      - .github/scripts/ios-device-*
  workflow_dispatch:
    inputs:
      compile_only:
        description: Compile the simulator app for a later verified replay without starting device journeys
        type: boolean
        default: false
      simulator_from_run:
        description: Use the unchanged authenticated simulator app from this producer run
        type: string
        default: ''
      replay_scope:
        description: Which checks to run when reusing a compiled simulator app
        type: choice
        options: [notifications, current-devices, minimum-devices, phones, account-deletion, offline]
        default: notifications
      verify_device_archive:
        description: Build and inspect a device SDK archive without distribution signing or submission
        type: boolean
        default: false
      verify_household_phone:
        description: Verify members, invitations and deletion review on the current isolated iPhone
        type: boolean
        default: false
      verify_household_deletion:
        description: Delete only the explicitly attested private-schema household (never repeat submission)
        type: boolean
        default: false
      verify_deletion_phone:
        description: Build once and verify deletion of the separately marked disposable account
        type: boolean
        default: false
      runner:
        description: Build host and architecture (iOS 17 phone uses a matching macOS 15 host)
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26]
      fixture_url:
        description: Optional temporary HTTPS tunnel to the isolated development backend
        type: string
        default: ''
      fixture_email:
        description: Optional existing cyntch-native-*+clerk_test@example.com identity
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Keep a capacity-starved host pool from holding up the other architecture.
  group: native-ios-${{ github.ref }}-${{ inputs.simulator_from_run && inputs.replay_scope || inputs.verify_device_archive && 'device-archive' || inputs.runner || 'macos-26-intel' }}
  # Finish device evidence for the active build; keep the newest next build queued.
  cancel-in-progress: false

jobs:
  compile:
    if: ${{ !inputs.simulator_from_run }}
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 90
    outputs:
      app_ready: ${{ steps.simulator_app.outputs.app_ready }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Public development identifier, not an authentication credential.
      # Optional native sign-in uses a reserved development test code.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZW1lcmdpbmctdG9hZC05OC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_API_URL: ${{ inputs.fixture_url || 'https://cyntch-simulator.invalid' }}
      CYNTCH_NATIVE_TEST_EMAIL: ${{ inputs.fixture_email || '' }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies and verify screenshot checks
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/device-screenshot-evidence.test.cjs
          node --test scripts/check-build-env.test.cjs
          node --test scripts/native-auth-smoke.test.cjs
          node --test scripts/native-household-smoke.test.cjs scripts/native-household-deletion-smoke.test.cjs
          node --test scripts/native-account-deletion-smoke.test.cjs
          node --test ../.github/scripts/ios-device-process.test.cjs
          node scripts/native-auth-smoke.cjs
      - name: Verify native account-cache inspection
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -parse-as-library \
            modules/cyntch-clerk-state/ios/ClerkPersistenceInspection.swift \
            modules/cyntch-clerk-state/tests/ClerkPersistenceInspectionTests.swift \
            -o "$RUNNER_TEMP/cyntch-clerk-persistence-tests"
          "$RUNNER_TEMP/cyntch-clerk-persistence-tests" 2>&1 | tee "$RUNNER_TEMP/cyntch-clerk-persistence-tests.log"
          xcrun swiftc -swift-version 5 -parse-as-library \
            modules/cyntch-clerk-state/ios/ClerkBiometricCleanup.swift \
            modules/cyntch-clerk-state/tests/ClerkBiometricCleanupTests.swift \
            -o "$RUNNER_TEMP/cyntch-clerk-biometric-tests"
          "$RUNNER_TEMP/cyntch-clerk-biometric-tests" 2>&1 | tee "$RUNNER_TEMP/cyntch-clerk-biometric-tests.log"
          xcrun swiftc -swift-version 5 -parse-as-library \
            modules/cyntch-clerk-state/ios/ClerkPersistenceInspection.swift \
            modules/cyntch-clerk-state/ios/ClerkBiometricCleanup.swift \
            modules/cyntch-clerk-state/tests/ClerkKeychainTests.swift \
            -o "$RUNNER_TEMP/cyntch-clerk-keychain-tests"
          "$RUNNER_TEMP/cyntch-clerk-keychain-tests" 2>&1 | tee "$RUNNER_TEMP/cyntch-clerk-keychain-tests.log"
      - name: Generate the native iOS project
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --no-install 2>&1 | tee "$RUNNER_TEMP/cyntch-ios-prebuild.log"
      - name: Install native dependencies
        working-directory: mobile/ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee "$RUNNER_TEMP/cyntch-ios-pods.log"
      - name: Compile the locally signed release simulator app
        if: ${{ !inputs.verify_device_archive }}
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in arm64|x86_64) ;; *) echo "Unsupported simulator host architecture"; exit 1;; esac
          printf '%s\n' "$arch" > "$RUNNER_TEMP/cyntch-ios-host-architecture.txt"
          xcodebuild -version
          xcodebuild \
            -workspace ios/Cyntch.xcworkspace \
            -scheme Cyntch \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/cyntch-derived" \
            -resultBundlePath "$RUNNER_TEMP/cyntch-native.xcresult" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS="$arch" \
            build 2>&1 | tee "$RUNNER_TEMP/cyntch-ios.log"
          test -s "$RUNNER_TEMP/cyntch-derived/Build/Products/Release-iphonesimulator/Cyntch.app/main.jsbundle"
      - name: Verify simulator signing and retain the test app
        id: simulator_app
        if: ${{ !inputs.verify_device_archive }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/cyntch-derived/Build/Products/Release-iphonesimulator/Cyntch.app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/cyntch-ios-signature-entitlements.plist"
          # Simulator entitlements are linked into the executable; its macOS
          # ad-hoc signature can legitimately have an empty entitlement plist.
          # Inspect the built binary, not only Xcode's intermediate .xcent input.
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test -n "$executable"
          test -n "$bundle_id"
          xcrun lipo "$app/$executable" -verify_arch "$(uname -m)"
          xcrun segedit "$app/$executable" \
            -extract __TEXT __entitlements "$RUNNER_TEMP/cyntch-ios-entitlements.plist" \
            -extract __TEXT __ents_der "$RUNNER_TEMP/cyntch-ios-entitlements.der"
          plutil -lint "$RUNNER_TEMP/cyntch-ios-entitlements.plist"
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/cyntch-ios-entitlements.plist")
          # This workflow has no developer team; Xcode supplies its simulator ID.
          test "$app_id" = "FAKETEAMID.$bundle_id"
          test -s "$RUNNER_TEMP/cyntch-ios-entitlements.der"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/cyntch-ios-simulator.zip"
          shasum -a 256 "$RUNNER_TEMP/cyntch-ios-simulator.zip" > "$RUNNER_TEMP/cyntch-ios-simulator.sha256"
          echo "app_ready=true" >> "$GITHUB_OUTPUT"
      - name: Share the compiled app with both simulator jobs
        if: ${{ !inputs.verify_device_archive }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-simulator
          path: |
            ${{ runner.temp }}/cyntch-ios-simulator.zip
            ${{ runner.temp }}/cyntch-ios-simulator.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Archive and verify the ARM64 iPhone and iPad app
        if: inputs.verify_device_archive
        run: bash ../.github/scripts/ios-device-archive.sh
      - name: Retain device archive evidence
        if: ${{ always() && inputs.verify_device_archive }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-device-archive
          path: ${{ runner.temp }}/cyntch-ios-archive-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain compiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-compilation
          path: |
            ${{ runner.temp }}/cyntch-clerk-persistence-tests.log
            ${{ runner.temp }}/cyntch-clerk-biometric-tests.log
            ${{ runner.temp }}/cyntch-clerk-keychain-tests.log
            ${{ runner.temp }}/cyntch-ios-prebuild.log
            ${{ runner.temp }}/cyntch-ios-pods.log
            ${{ runner.temp }}/cyntch-ios.log
            ${{ runner.temp }}/cyntch-ios-host-architecture.txt
            ${{ runner.temp }}/cyntch-ios-entitlements.plist
            ${{ runner.temp }}/cyntch-ios-entitlements.der
            ${{ runner.temp }}/cyntch-ios-signature-entitlements.plist
            ${{ runner.temp }}/cyntch-native.xcresult
            mobile/ios/Podfile.lock
            mobile/ios/Podfile
            mobile/ios/Pods/Target Support Files/CyntchClerkState/*.xcconfig
          if-no-files-found: warn
          retention-days: 7

  device:
    name: Test ${{ matrix.family }} (${{ matrix.runtime }})
    needs: compile
    if: ${{ always() && !cancelled() && !inputs.compile_only && (needs.compile.outputs.app_ready == 'true' || (inputs.simulator_from_run && !inputs.verify_device_archive && needs.compile.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    # The app is compiled once with the release toolchain. Use an older XCTest
    # host for the iOS 17 phone that could not start the driver. The iPad's
    # original host already executed its UI tests. Preserve binary architecture.
    runs-on: ${{ matrix.runtime == '17.0' && matrix.family == 'iphone' && (inputs.runner == 'macos-26' && 'macos-15' || 'macos-15-intel') || inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON((inputs.verify_household_phone || inputs.verify_household_deletion || inputs.verify_deletion_phone) && '["current"]' || inputs.simulator_from_run && inputs.replay_scope != 'phones' && (inputs.replay_scope == 'minimum-devices' && '["17.0"]' || '["current"]') || '["current","17.0"]') }}
        family: ${{ fromJSON((inputs.verify_household_phone || inputs.verify_household_deletion || inputs.verify_deletion_phone) && '["iphone"]' || inputs.simulator_from_run && (inputs.replay_scope == 'notifications' || inputs.replay_scope == 'phones' || inputs.replay_scope == 'account-deletion' || inputs.replay_scope == 'offline') && '["iphone"]' || '["iphone","ipad"]') }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      DEVELOPER_DIR: ${{ matrix.runtime == '17.0' && matrix.family == 'iphone' && '/Applications/Xcode_16.4.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
      CYNTCH_IOS_TEST_RUNTIME: ${{ matrix.runtime == '17.0' && '17.0' || '' }}
      CYNTCH_IOS_TEST_FAMILY: ${{ matrix.family }}
      CYNTCH_IOS_SIMULATOR_PRODUCER: ${{ inputs.simulator_from_run }}
      CYNTCH_IOS_REPLAY_SCOPE: ${{ inputs.verify_deletion_phone && 'account-deletion' || inputs.simulator_from_run && inputs.replay_scope || '' }}
      CYNTCH_NATIVE_HOUSEHOLD_CHECK: ${{ (inputs.verify_household_phone || inputs.verify_household_deletion) && 'true' || 'false' }}
      CYNTCH_NATIVE_HOUSEHOLD_DELETE_CHECK: ${{ inputs.verify_household_deletion && 'true' || 'false' }}
      MAESTRO_DRIVER_STARTUP_TIMEOUT: ${{ matrix.runtime == '17.0' && '360000' || '240000' }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZW1lcmdpbmctdG9hZC05OC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_API_URL: ${{ inputs.fixture_url || 'https://cyntch-simulator.invalid' }}
      CYNTCH_NATIVE_TEST_EMAIL: ${{ inputs.fixture_email || '' }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.simulator_from_run && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Verify the source of the reusable simulator app
        if: inputs.simulator_from_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CYNTCH_IOS_SIMULATOR_PRODUCER" =~ ^[1-9][0-9]*$ ]]
          node -e "if (!require('./scripts/native-auth-smoke.cjs').authFixture()) process.exit(1)"
          if [[ "$CYNTCH_IOS_REPLAY_SCOPE" == 'account-deletion' ]]; then
            node -e "require('./scripts/native-account-deletion-smoke.cjs').deletionFixture()"
          fi
          meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CYNTCH_IOS_SIMULATOR_PRODUCER")
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" '
            .event == "workflow_dispatch" and .head_branch == $branch and
            .head_repository.full_name == $repo and .path == ".github/workflows/native-ios.yml"' <<<"$meta" >/dev/null
          sha=$(jq -r '.head_sha' <<<"$meta")
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          # Only verification/docs and the listed server-only changes are allowed.
          # These server modules and root ESLint config are not mobile inputs.
          # Never label an older app as new code.
          git -C .. diff --quiet "$sha" "$GITHUB_SHA" -- . ':!.github/' ':!tests/' ':!mobile/README.md' \
            ':!mobile/.maestro*/**' ':!mobile/scripts/ios-*-smoke.cjs' ':!mobile/scripts/native-auth-smoke.cjs' ':!mobile/scripts/native-kiosk-smoke.cjs' \
            ':!mobile/scripts/native-notification-preferences-smoke.cjs' ':!mobile/scripts/native-household-smoke.cjs' ':!mobile/scripts/native-household-smoke.test.cjs' ':!mobile/scripts/native-household-deletion-smoke.cjs' ':!mobile/scripts/native-household-deletion-smoke.test.cjs' \
            ':!mobile/scripts/native-account-deletion-smoke.cjs' ':!mobile/scripts/native-account-deletion-smoke.test.cjs' \
            ':!lib/native-notification-outbox.ts' ':!lib/native-notification-worker.ts' ':!middleware.ts' ':!eslint.config.mjs'
          printf 'CYNTCH_IOS_APP_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - name: Download the selected compiled simulator app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-ios-simulator
          path: ${{ runner.temp }}/cyntch-ios-compile-evidence
          digest-mismatch: error
          github-token: ${{ github.token }}
          run-id: ${{ inputs.simulator_from_run || github.run_id }}
      - name: Verify bounded offline network controls
        # The interruption helper remains inactive in every other journey.
        run: node --test ../.github/scripts/ios-device-network.test.cjs
      - name: Verify and unpack the exact compiled app
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cyntch-ios-compile-evidence"
          archive="$evidence/cyntch-ios-simulator.zip"
          expected=$(awk '{print $1}' "$evidence/cyntch-ios-simulator.sha256")
          test "${#expected}" -eq 64
          actual=$(shasum -a 256 "$archive" | awk '{print $1}')
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/cyntch-ios-device-app.sha256"
          ditto -x -k "$archive" "$RUNNER_TEMP/cyntch-ios-device-app"
          app="$RUNNER_TEMP/cyntch-ios-device-app/Cyntch.app"
          if [[ -n "$CYNTCH_IOS_SIMULATOR_PRODUCER" ]]; then
            node -e 'const b=require("fs").readFileSync(process.argv[1]),s=process.env.EXPO_PUBLIC_API_URL.replace(/\/$/,"");if(!b.includes(s)&&!b.includes(Buffer.from(s,"utf16le")))throw Error("Simulator app is not built for this test backend")' "$app/main.jsbundle"
          fi
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          xcrun lipo "$app/$executable" -verify_arch "$(uname -m)"
          test "$('/usr/libexec/PlistBuddy' -c 'Print :MinimumOSVersion' "$app/Info.plist")" = '17.0'
          if [[ -z "$CYNTCH_IOS_SIMULATOR_PRODUCER" ]]; then
            # This artifact came from this run's compile job and passed all
            # digest/signature/architecture checks above.
            printf 'CYNTCH_IOS_APP_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Install the original iOS 17 runtime from Apple
        if: matrix.runtime == '17.0'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/cyntch-ios17-toolchain.txt"
          if [[ "$CYNTCH_IOS_TEST_FAMILY" == iphone ]]; then
            grep -Fx 'Xcode 16.4' "$RUNNER_TEMP/cyntch-ios17-toolchain.txt"
          fi
          if xcrun simctl list runtimes --json | jq -e 'any(.runtimes[]; .isAvailable and .version == "17.0" and (.identifier | contains(".iOS-")))' >/dev/null; then
            echo "The required iOS 17.0 runtime is already installed."
            exit 0
          fi
          runtime_dir="$RUNNER_TEMP/cyntch-ios17-runtime"
          mkdir -p "$runtime_dir"
          xcodebuild -downloadPlatform iOS -buildVersion 17.0 \
            -exportPath "$runtime_dir" 2>&1 | tee "$RUNNER_TEMP/cyntch-ios17-download.log"
          shopt -s nullglob
          images=("$runtime_dir"/*.dmg)
          test "${#images[@]}" -eq 1
          xcodebuild -importPlatform "${images[0]}" 2>&1 | tee "$RUNNER_TEMP/cyntch-ios17-import.log"
      - name: Install pinned simulator test runner
        run: |
          set -euo pipefail
          java -version
          curl --fail --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7' "$RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro" --version
      - name: Parse native UI flows before creating a simulator
        timeout-minutes: 3
        run: |
          java -cp "$RUNNER_TEMP/maestro-cli/maestro/lib/*" \
            ../.github/scripts/CheckMaestroFlows.java . .maestro*/*.yaml
      - name: Verify the device at both text sizes
        timeout-minutes: 45
        run: |
          set -o pipefail
          node scripts/ios-simulator-smoke.cjs \
            "$RUNNER_TEMP/cyntch-ios-device-app/Cyntch.app" \
            "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro" \
            "$RUNNER_TEMP/cyntch-ios-device-smoke" \
            2>&1 | tee "$RUNNER_TEMP/cyntch-ios-device-smoke.log"
      - name: Retain runtime inventory
        if: always()
        run: xcrun simctl list --json > "$RUNNER_TEMP/cyntch-ios-device-inventory.json"
      - name: Diagnose the development sign-in connection after a failed journey
        if: failure() && inputs.fixture_email
        run: |
          # Compare the runner's normal TLS trust with the simulator's retained
          # URLSession error. Do not send account data, record bodies, or skip TLS.
          curl --silent --show-error --max-time 15 --output /dev/null \
            --write-out 'http=%{http_code} tls_verify=%{ssl_verify_result}\n' \
            'https://emerging-toad-98.clerk.accounts.dev/v1/environment' \
            > "$RUNNER_TEMP/cyntch-ios-auth-tls.txt" 2>&1 || true
      - name: Retain device evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-devices-${{ matrix.runtime }}-${{ matrix.family }}
          path: |
            ${{ runner.temp }}/cyntch-ios-device-app.sha256
            ${{ runner.temp }}/cyntch-ios17-download.log
            ${{ runner.temp }}/cyntch-ios17-toolchain.txt
            ${{ runner.temp }}/cyntch-ios17-import.log
            ${{ runner.temp }}/cyntch-ios-device-inventory.json
            ${{ runner.temp }}/cyntch-ios-auth-tls.txt
            ${{ runner.temp }}/cyntch-ios-device-smoke.log
            ${{ runner.temp }}/cyntch-ios-device-smoke/
          if-no-files-found: warn
          retention-days: 7
