name: Native Android verification

on:
  push:
    branches: [codex/native-mobile-apps]
    paths:
      - mobile/**
      - '!mobile/**/*.md'
      - '!mobile/scripts/ios-*'
      - shared/**
      - lib/recurrence.ts
      - lib/time-rules.ts
      - lib/types.ts
      - .github/workflows/native-android.yml
      - .github/scripts/android-notification-icon.cjs
  workflow_dispatch:
    inputs:
      foldable_from_run:
        description: Replay only foldable checks using a verified unchanged APK from this workflow
        type: string
        default: ''
      offline_phone_from_run:
        description: Verify offline completion on a disposable phone using an unchanged APK and the prepared isolated task
        type: string
        default: ''
      verify_offline_phone:
        description: Build a fresh APK and verify offline completion on the isolated phone fixture
        type: boolean
        default: false
      verify_arm64_bundle:
        description: Also build an ARM64 App Bundle and check Play-style device splits
        type: boolean
        default: false
      fixture_url:
        description: Optional temporary HTTPS tunnel to the isolated development backend
        type: string
        default: ''
      fixture_email:
        description: Optional existing cyntch-native-*+clerk_test@example.com identity
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A signed-out push must not replace queued household or ARM bundle evidence.
  group: native-android-${{ github.ref }}-${{ inputs.offline_phone_from_run && 'offline-phone-replay' || inputs.foldable_from_run && 'foldable-replay' || inputs.verify_arm64_bundle && 'bundle' || inputs.fixture_email && 'authenticated' || 'signed-out' }}
  # Finish device evidence for the active build; keep the newest next build queued.
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !inputs.foldable_from_run && !inputs.offline_phone_from_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk_ready: ${{ steps.compile.outputs.apk_ready }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      # Public development identifier; optional sign-in uses a reserved test code.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZW1lcmdpbmctdG9hZC05OC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_API_URL: ${{ inputs.fixture_url || 'https://cyntch-simulator.invalid' }}
      CYNTCH_NATIVE_TEST_EMAIL: ${{ inputs.fixture_email || '' }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      CYNTCH_CHECK_BUNDLE: ${{ inputs.verify_arm64_bundle && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select runner Java and verify mobile source
        run: |
          set -euo pipefail
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          node --test scripts/device-screenshot-evidence.test.cjs
          node --test scripts/check-build-env.test.cjs
          node --test scripts/native-auth-smoke.test.cjs
          node scripts/native-auth-smoke.cjs
      - name: Generate the native Android project
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee "$RUNNER_TEMP/cyntch-android-prebuild.log"
          grep -Fq 'includeBuild("../vendor/clerk-android-ui")' android/settings.gradle
          grep -Fq 'name = "cyntch-clerk-ui"' android/settings.gradle
      - name: Restore Gradle dependencies and compiled task cache
        # Run after prebuild so cache keys and wrapper validation include the
        # generated project. Use GitHub's basic cache, with no Build Scan upload.
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/codex/native-mobile-apps' }}
          dependency-graph: disabled
          build-scan-publish: false
      - name: Compile optimized emulator APK with test signing
        id: compile
        working-directory: mobile/android
        run: |
          set -euo pipefail
          java -version
          chmod +x gradlew
          abis=x86_64
          bundle_tasks=()
          if [[ "$CYNTCH_CHECK_BUNDLE" == true ]]; then
            abis=x86_64,arm64-v8a
            bundle_tasks=(:app:bundleRelease)
          fi
          ./gradlew -p ../vendor/clerk-android-ui assembleRelease --build-cache --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2' \
            2>&1 | tee "$RUNNER_TEMP/cyntch-clerk-ui-build.log"
          ./gradlew :app:dependencyInsight --dependency clerk --configuration releaseRuntimeClasspath \
            :app:assembleRelease "${bundle_tasks[@]}" --build-cache --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2' \
            -PreactNativeArchitectures="$abis" \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            2>&1 | tee "$RUNNER_TEMP/cyntch-android-build.log"
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test "$(unzip -p "$apk" assets/index.android.bundle | wc -c)" -gt 0
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          node ../../.github/scripts/android-notification-icon.cjs "$aapt" "$apk"
          mkdir -p "$RUNNER_TEMP/cyntch-android-apk"
          cp "$apk" "$RUNNER_TEMP/cyntch-android-apk/cyntch-emulator-test-signed.apk"
          sha256sum "$RUNNER_TEMP/cyntch-android-apk/cyntch-emulator-test-signed.apk" > "$RUNNER_TEMP/cyntch-android-apk/sha256.txt"
          printf 'Source: %s\nRelease APK (%s); generated development signing key.\nSigned-out verification, with optional isolated-backend development-test sign-in. Not a store artifact.\n' "$GITHUB_SHA" "$abis" > "$RUNNER_TEMP/cyntch-android-apk/README.txt"
          echo 'apk_ready=true' >> "$GITHUB_OUTPUT"
      - name: Verify the ARM64 bundle and device-specific split APKs
        if: inputs.verify_arm64_bundle
        run: bash scripts/android-bundle-compat.sh
      - name: Retain bundle and 16 KB compatibility evidence
        if: ${{ always() && inputs.verify_arm64_bundle }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-test-bundle
          path: ${{ runner.temp }}/cyntch-bundle-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain compiled APK and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-verification
          path: |
            ${{ runner.temp }}/cyntch-android-prebuild.log
            ${{ runner.temp }}/cyntch-android-build.log
            ${{ runner.temp }}/cyntch-clerk-ui-build.log
            ${{ runner.temp }}/cyntch-android-apk/
            mobile/android/app/build/outputs/mapping/release/mapping.txt
            mobile/android/settings.gradle
            mobile/vendor/clerk-android-ui/build/generated/upstream/kotlin/com/clerk/ui/core/scaffold/ClerkThemedAuthScaffold.kt
            mobile/vendor/clerk-android-ui/build/generated/upstream/kotlin/com/clerk/ui/core/appbar/ClerkTopAppbar.kt
            mobile/vendor/clerk-android-ui/build/generated/upstream/kotlin/com/clerk/ui/core/footer/DevelopmentModeWarning.kt
            mobile/vendor/clerk-android-ui/build/generated/upstream/kotlin/com/clerk/ui/core/button/social/ClerkSocialButton.kt
            mobile/vendor/clerk-android-ui/build/generated/upstream/kotlin/com/clerk/ui/core/button/standard/ClerkButton.kt
          if-no-files-found: warn
          retention-days: 7

  device:
    name: Test Android (${{ matrix.device }})
    needs: verify
    if: ${{ always() && !cancelled() && (needs.verify.outputs.apk_ready == 'true' || ((inputs.foldable_from_run || inputs.offline_phone_from_run) && !(inputs.foldable_from_run && inputs.offline_phone_from_run) && !inputs.verify_arm64_bundle && needs.verify.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.offline_phone_from_run || inputs.verify_offline_phone) && '[{"device":"phone","avd":"cyntch-phone","api":"37.0","target":"google_apis_ps16k","profile":"pixel_6"}]' || inputs.foldable_from_run && '[{"device":"foldable","avd":"cyntch-foldable","api":"37.0","target":"google_apis_ps16k","profile":"pixel_fold"}]' || '[{"device":"phone","avd":"cyntch-phone","api":"37.0","target":"google_apis_ps16k","profile":"pixel_6"},{"device":"tablet","avd":"cyntch-tablet","api":"37.0","target":"google_apis_ps16k","profile":"pixel_tablet"},{"device":"foldable","avd":"cyntch-foldable","api":"37.0","target":"google_apis_ps16k","profile":"pixel_fold"},{"device":"minimum-api-24","avd":"cyntch-minimum","api":"24","target":"google_apis","profile":"Nexus 5"}]') }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      CYNTCH_DEVICE: ${{ matrix.device }}
      CYNTCH_AVD: ${{ matrix.avd }}
      CYNTCH_PROFILE: ${{ matrix.profile }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZW1lcmdpbmctdG9hZC05OC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_API_URL: ${{ inputs.fixture_url || 'https://cyntch-simulator.invalid' }}
      CYNTCH_NATIVE_TEST_EMAIL: ${{ inputs.fixture_email || '' }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      CYNTCH_ANDROID_APK_PRODUCER: ${{ inputs.foldable_from_run || inputs.offline_phone_from_run }}
      CYNTCH_ANDROID_OFFLINE: ${{ (inputs.offline_phone_from_run || inputs.verify_offline_phone) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ (inputs.foldable_from_run || inputs.offline_phone_from_run) && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Verify the source of the reusable APK
        if: inputs.foldable_from_run || inputs.offline_phone_from_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CYNTCH_ANDROID_APK_PRODUCER" =~ ^[1-9][0-9]*$ ]]
          node -e "if (!require('./scripts/native-auth-smoke.cjs').authFixture()) process.exit(1)"
          meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CYNTCH_ANDROID_APK_PRODUCER")
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" '
            .event == "workflow_dispatch" and .head_branch == $branch and
            .head_repository.full_name == $repo and .path == ".github/workflows/native-android.yml"' <<<"$meta" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CYNTCH_ANDROID_APK_PRODUCER/jobs" |
            jq -e '.jobs | any(.name == "verify" and .conclusion == "success")' >/dev/null
          sha=$(jq -r '.head_sha' <<<"$meta")
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          # Only test harness and documentation changes may reuse this binary.
          git -C .. diff --quiet "$sha" "$GITHUB_SHA" -- . ':!.github/' ':!tests/' ':!mobile/README.md' \
            ':!mobile/.maestro*/**' ':!mobile/scripts/ios-*-smoke.cjs' ':!mobile/scripts/native-auth-smoke.cjs' \
            ':!mobile/scripts/native-kiosk-smoke.cjs' ':!mobile/scripts/android-foldable-smoke.cjs' \
            ':!mobile/scripts/android-emulator-smoke.cjs' ':!mobile/scripts/android-offline-smoke.cjs' \
            ':!mobile/scripts/native-notification-preferences-smoke.cjs'
          printf 'CYNTCH_ANDROID_APP_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - name: Verify UI process cleanup
        if: matrix.device == 'foldable'
        run: node --test ../.github/scripts/ios-device-process.test.cjs
      - name: Verify offline test controls
        if: matrix.device == 'phone' && inputs.fixture_email
        run: node --test ../.github/scripts/android-offline-control.test.cjs
      - name: Download the selected compiled APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-android-verification
          path: ${{ runner.temp }}/cyntch-android-compile-evidence
          digest-mismatch: error
          run-id: ${{ inputs.foldable_from_run || inputs.offline_phone_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the exact compiled APK
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find "$RUNNER_TEMP/cyntch-android-compile-evidence" -type f -name cyntch-emulator-test-signed.apk -print0)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          expected=$(awk '{print $1}' "$(dirname "$apk")/sha256.txt")
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          actual=$(sha256sum "$apk" | awk '{print $1}')
          test "$actual" = "$expected"
          if [[ -n "$CYNTCH_ANDROID_APK_PRODUCER" ]]; then
            unzip -p "$apk" assets/index.android.bundle > "$RUNNER_TEMP/cyntch-reused-android.bundle"
            node -e 'const b=require("fs").readFileSync(process.argv[1]),s=process.env.EXPO_PUBLIC_API_URL.replace(/\/$/,"");if(!b.includes(s)&&!b.includes(Buffer.from(s,"utf16le")))throw Error("APK does not target the isolated test backend")' "$RUNNER_TEMP/cyntch-reused-android.bundle"
          fi
          mkdir -p "$RUNNER_TEMP/cyntch-android-$CYNTCH_DEVICE"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/cyntch-android-$CYNTCH_DEVICE/apk.sha256"
          printf 'CYNTCH_TEST_APK=%s\n' "$apk" >> "$GITHUB_ENV"
          printf 'CYNTCH_ANDROID_APP_SHA=%s\n' "${CYNTCH_ANDROID_APP_SHA:-$GITHUB_SHA}" >> "$GITHUB_ENV"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
      - name: Install pinned device test runner
        if: matrix.device != 'minimum-api-24'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7' "$RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro" --version
      - name: Parse native UI flows before creating an emulator
        if: matrix.device != 'minimum-api-24'
        timeout-minutes: 3
        run: |
          java -cp "$RUNNER_TEMP/maestro-cli/maestro/lib/*" \
            ../.github/scripts/CheckMaestroFlows.java . .maestro*/*.yaml
      - name: Enable emulator hardware acceleration
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select SDK tools that understand the Android 17 system image
        if: matrix.device != 'minimum-api-24'
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/cyntch-api37-sdk"
          mkdir -p "$sdk"
          cp -R "$ANDROID_HOME/licenses" "$sdk/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'cmdline-tools;22.0'
          # The pinned emulator action invokes cmdline-tools/latest/bin.
          ln -s 22.0 "$sdk/cmdline-tools/latest"
          test -x "$sdk/cmdline-tools/latest/bin/avdmanager"
          grep -Fxq 'Pkg.Revision=22.0' "$sdk/cmdline-tools/22.0/source.properties"
          inventory="$RUNNER_TEMP/cyntch-android-$CYNTCH_DEVICE/profiles.txt"
          ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk" "$sdk/cmdline-tools/latest/bin/avdmanager" list device > "$inventory"
          grep -F "\"${CYNTCH_PROFILE}\"" "$inventory"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Boot device and verify the compiled app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 30
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: ${{ matrix.avd }}
          disk-size: 6G
          cores: 2
          ram-size: ${{ matrix.device == 'minimum-api-24' && '2048M' || '4096M' }}
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: bash scripts/android-device-ci.sh
      - name: Retain device evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-${{ matrix.device }}
          path: ${{ runner.temp }}/cyntch-android-${{ matrix.device }}/
          if-no-files-found: warn
          retention-days: 7
